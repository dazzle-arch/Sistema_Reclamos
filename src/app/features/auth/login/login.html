<main class="login-container d-flex justify-content-center align-items-center">
    <div class="card shadow-sm" style="width: 400px;">
        <div class="card-header bg-white text-center py-3">
            <h2 class="text-danger fw-bold m-0">Inicion de sesión</h2>
        </div>
        <div class="card-body">
            <p class="text-center text-muted mb-4">Solo personal autorizado</p>

            <div class="mb-3">
                <label class="form-label fw-bold">Usuario</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" class="form-control">
            </div>

            <div class="d-flex flex-column align-items-center gap-2">
                <button class="button btn-danger w-100 py-2 fw-bold" (click)="ingresar()">Iniciar sesion</button>
                <a href="#" class="text-muted small">Olvide mi contraseña</a> 
                <a class="text-muted small" routerLink="/home">Volver a Inicio</a>
            </div>
        </div>
    </div>
</main>
