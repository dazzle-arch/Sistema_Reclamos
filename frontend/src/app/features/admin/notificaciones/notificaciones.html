<main class="panel-container d-flex justify-content-center align-items-center py-5">
    <div class="card shadow-sm d-flex flex-row" style="width: 1500px; min-height: 800px;">
        <app-sidebar-admin></app-sidebar-admin>
        <div class="content flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">Notificaciones</h4>
                <button class="btn btn-outline-danger btn-sm">Marcar todas como leidas</button>
            </div>

            <div class="d-flex gap-3 mb-4">
                <select class="form-select" style="max-width: 200px;">
                    <option value="" selected disabled>Filtrar por estado</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="enviada">Enviadas</option>
                    <option value="fallido">Fallidas</option>
                </select>
            </div>

            <div class="list-group">
                <div class="list-group-item notificaciones-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="fw-bold mb-1">Asunto de la notificacion</p>
                            <p class="mb-1 small">Mensaje de la notificación</p>
                            <p class="mb-0 small text-muted">Reclamo N° · Fecha y hora</p>
                        </div>
                        <span class="badge bg-warning text-dark">Pendiente</span>
                    </div>
                </div>

                <div class="list-group-item notificaciones-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="fw-bold mb-1">Asunto de la notificacion</p>
                            <p class="mb-1 small">Mensaje de la notificación</p>
                            <p class="mb-0 small text-muted">Reclamo N° · Fecha y hora</p>
                        </div>
                        <span class="badge bg-warning text-dark">Enviado</span>
                    </div>
                </div>

                <div class="list-group-item notificaciones-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="fw-bold mb-1">Asunto de la notificacion</p>
                            <p class="mb-1 small">Mensaje de la notificación</p>
                            <p class="mb-0 small text-muted">Reclamo N° · Fecha y hora</p>
                        </div>
                        <span class="badge bg-warning text-dark">Fallido</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
